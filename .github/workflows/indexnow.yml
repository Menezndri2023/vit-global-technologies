name: IndexNow

# Après chaque déploiement de production réussi sur Vercel, signale les URL du sitemap aux moteurs IndexNow.
on:
  deployment_status:

jobs:
  indexnow:
    # Vercel nomme l'environnement « Production – <projet> » ; seul le projet principal est retenu.
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production – vit-global-technologies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs https://www.vit-global.tech
