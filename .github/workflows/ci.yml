name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valeurs factices : le build ne se connecte à aucune base ni service externe.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma validate
      - run: npm run build
      - name: Audit des dépendances de production (informatif)
        run: npm audit --omit=dev --audit-level=critical
